<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    分享卡片配图的源文件（1200×630）。
    改完用 npm run og 重新生成 public/og-cover.png。
    配色取自 src/styles/tokens.css，和站点保持一致。
  -->
  <defs>
    <!-- 环境光：橙 / 紫 / 青，对应站点首屏那三团色晕 -->
    <radialGradient id="glowOrange" cx="12%" cy="0%" r="62%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="92%" cy="8%" r="58%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowTeal" cx="52%" cy="112%" r="60%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>

    <!-- 标题的暖色渐变，同站点 .brand-title -->
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="12%" stop-color="#ffffff" />
      <stop offset="62%" stop-color="#ffb547" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>

    <!-- 细网格 -->
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0 L0 0 0 46" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1" />
    </pattern>
    <!-- 网格只在上半部分显现，下方渐隐 -->
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="1" />
      <stop offset="70%" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <mask id="gridMask">
      <rect width="1200" height="630" fill="url(#gridFade)" />
    </mask>
  </defs>

  <!-- 底色：与 tokens.css 的 bg-base 一致 -->
  <rect width="1200" height="630" fill="#0a0e14" />
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridMask)" />
  <rect width="1200" height="630" fill="url(#glowOrange)" />
  <rect width="1200" height="630" fill="url(#glowPurple)" />
  <rect width="1200" height="630" fill="url(#glowTeal)" />

  <!-- kicker 胶囊 -->
  <rect x="88" y="128" width="232" height="42" rx="21"
        fill="#ff9900" fill-opacity="0.14"
        stroke="#ff9900" stroke-opacity="0.28" stroke-width="1" />
  <text x="204" y="156" text-anchor="middle"
        font-family="'JetBrains Mono', ui-monospace, Menlo, monospace"
        font-size="17" font-weight="600" letter-spacing="3.4" fill="#ffb547">HALL OF FAME</text>

  <!-- 主标题 -->
  <text x="88" y="286"
        font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif"
        font-size="94" font-weight="700" letter-spacing="-2" fill="url(#titleFill)">UG 名人榜</text>

  <!-- 副标题：字号压到 27，否则右端会撞上地图标记那组装饰 -->
  <text x="88" y="346"
        font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif"
        font-size="27" fill="#a3b1c2">亚马逊云科技 User Group · Community Hall of Fame</text>

  <!-- 一句话介绍 -->
  <text x="88" y="404"
        font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif"
        font-size="24" fill="#7d8b9c">记录每一位把云社区带到线下、带到身边的人。</text>

  <!-- 角色徽章：颜色与 content/roles.yml 对应 -->
  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     font-size="20" font-weight="650" fill="#10131a">
    <rect x="88"  y="472" width="92"  height="44" rx="22" fill="#fbbf24" />
    <text x="134" y="501" text-anchor="middle">Hero</text>

    <rect x="196" y="472" width="82"  height="44" rx="22" fill="#ff9900" />
    <text x="237" y="501" text-anchor="middle">UGL</text>

    <rect x="294" y="472" width="82"  height="44" rx="22" fill="#2dd4bf" />
    <text x="335" y="501" text-anchor="middle">UGA</text>

    <rect x="392" y="472" width="82"  height="44" rx="22" fill="#f472b6" />
    <text x="433" y="501" text-anchor="middle">UGO</text>

    <rect x="490" y="472" width="72"  height="44" rx="22" fill="#a78bfa" />
    <text x="526" y="501" text-anchor="middle">CB</text>

    <rect x="576" y="472" width="112" height="44" rx="22" fill="#38bdf8" />
    <text x="632" y="501" text-anchor="middle">志愿者</text>
  </g>

  <!-- 右侧地图标记装饰：呼应站点的社区版图 -->
  <g opacity="0.9">
    <!-- 外圈光晕 -->
    <circle cx="965" cy="300" r="150" fill="#ff9900" fill-opacity="0.05" />
    <circle cx="965" cy="300" r="104" fill="#ff9900" fill-opacity="0.07" />

    <!-- 三个水滴标记，尺寸/形状同站点 .map-pin -->
    <g transform="translate(965 262)">
      <path d="M0 -46 C 25 -46 46 -25 46 0 C 46 33 0 74 0 74 C 0 74 -46 33 -46 0 C -46 -25 -25 -46 0 -46 Z"
            fill="#ff9900" stroke="#ffffff" stroke-opacity="0.85" stroke-width="4" />
      <circle cx="0" cy="0" r="17" fill="#0a0e14" />
    </g>
    <g transform="translate(872 350) scale(0.66)">
      <path d="M0 -46 C 25 -46 46 -25 46 0 C 46 33 0 74 0 74 C 0 74 -46 33 -46 0 C -46 -25 -25 -46 0 -46 Z"
            fill="#a78bfa" stroke="#ffffff" stroke-opacity="0.85" stroke-width="4" />
      <circle cx="0" cy="0" r="17" fill="#0a0e14" />
    </g>
    <g transform="translate(1058 356) scale(0.6)">
      <path d="M0 -46 C 25 -46 46 -25 46 0 C 46 33 0 74 0 74 C 0 74 -46 33 -46 0 C -46 -25 -25 -46 0 -46 Z"
            fill="#2dd4bf" stroke="#ffffff" stroke-opacity="0.85" stroke-width="4" />
      <circle cx="0" cy="0" r="17" fill="#0a0e14" />
    </g>
  </g>

  <!-- 底部细线 + 域名占位 -->
  <rect x="88" y="560" width="1024" height="1" fill="#ffffff" fill-opacity="0.08" />
  <text x="88" y="592"
        font-family="'JetBrains Mono', ui-monospace, Menlo, monospace"
        font-size="18" fill="#7d8b9c">community · 由社区共同维护</text>
</svg>
