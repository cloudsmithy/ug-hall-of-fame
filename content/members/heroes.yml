# ============================================================
#  成员名单 · Community Hero
# ============================================================
#  数据来源：AWS Builder Center 公开名录（builder.aws.com/community），
#  筛选所在地为中国大陆的成员；homepage 指向其 Builder Center 主页。
#
#  数据来源：AWS Builder Center 公开名录（builder.aws.com/community），
#  筛选所在地为中国大陆的成员；homepage 指向其 Builder Center 主页。
#
#  数据来源：AWS Builder Center 公开名录（builder.aws.com/community），
#  筛选所在地为大中华区（中国大陆、香港、台湾）的成员；homepage 指向其 Builder Center 主页。
#
#  数据来源：AWS Builder Center 公开名录（builder.aws.com/community），
#  筛选所在地为大中华区（中国大陆、香港、台湾）的成员；homepage 指向其 Builder Center 主页。
#
#  文件怎么分只是为了方便维护，最终会合并成一份名单；
#  一个人属于什么角色，只由下面的 roles 字段决定。
#
#  字段说明（* 为必填）：
#    id *      唯一标识，建议英文小写连字符，用于 URL 锚点
#    name *    姓名
#    nickname  昵称 / 社区 ID，显示在姓名旁，也参与搜索
#    roles *   角色列表，取值见 roles.yml 的 key
#              第一个作为「主身份」，决定卡片配色
#    title     一句话头衔
#    city      所在城市（显示用，也参与搜索）
#    avatar    头像，三种写法都支持，留空则自动用姓名首字生成色块：
#                1. 本地图片：把图丢进 content/images/，这里写文件名
#                   avatar: zhaoyun.jpg
#                2. 在线图片：直接写完整链接
#                   avatar: https://example.com/avatar.jpg
#                3. public 目录：以 / 开头，原样发布不做处理
#                   avatar: /avatar.jpg
#              推荐第 1 种：构建时会自动加内容哈希，换图后不会读到旧缓存；
#              文件名写错会在浏览器控制台列出现有文件，不会静默变成色块。
#    skills    技能标签数组
#    bio       人物介绍
#    homepage  个人主页 URL，弹窗里显示醒目的跳转按钮
#    links     其他链接数组，每项含 label + url
# ============================================================

