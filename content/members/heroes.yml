# ============================================================
#  成员名单 · Community Hero
# ============================================================
#  文件怎么分只是为了方便维护，最终会合并成一份名单；
#  一个人属于什么角色，只由下面的 roles 字段决定。
#
#  字段说明（* 为必填）：
#    id *      唯一标识，建议英文小写连字符，用于 URL 锚点
#    name *    姓名
#    nickname  昵称 / 社区 ID，显示在姓名旁，也参与搜索
#    roles *   角色列表，取值见 roles.yml 的 key
#              第一个作为「主身份」，决定卡片配色和地图标记
#    title     一句话头衔
#    city      所在城市（显示用）
#    location  [纬度, 经度]，用于地图打点；留空则不上地图
#              坐标查询：Google 地图右键任意位置即可复制
#    avatar    头像，三种写法都支持，留空则自动用姓名首字生成色块：
#                1. 本地图片：把图丢进 content/images/，这里写文件名
#                   avatar: zhaoyun.jpg
#                2. 在线图片：直接写完整链接
#                   avatar: https://example.com/avatar.jpg
#                3. public 目录：以 / 开头，原样发布不做处理
#                   avatar: /avatar.jpg
#              推荐第 1 种：构建时会自动加内容哈希，换图后不会读到旧缓存；
#              文件名写错会在浏览器控制台列出现有文件，不会静默变成色块。
#    skills    技能标签数组
#    bio       人物介绍
#    homepage  个人主页 URL，弹窗里显示醒目的跳转按钮
#    links     其他链接数组，每项含 label + url
# ============================================================

- id: zhang-wei
  name: 张伟
  nickname: WeiZ
  roles: [HERO]
  title: Community Hero · 社区标杆
  city: 北京
  location: [39.9042, 116.4074]
  # 本地图片：文件放在 content/images/sample-avatar.png
  avatar: sample-avatar.png
  skills: [架构设计, 技术领导力, 社区布道, 导师]
  bio: 深耕社区十余年的标杆人物，影响了一代开发者，长期产出高质量内容并培养了大量社区骨干。
  homepage: https://example.com/zhangwei
  links: []
