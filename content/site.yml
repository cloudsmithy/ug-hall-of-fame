# ============================================================
#  站点基本信息
# ============================================================
#  改这里可以调整标题、副标题和页面文案。
#  改完存盘，开发服务器会自动热更新。
# ============================================================

title: UG 名人榜
subtitle: 亚马逊云科技 User Group · Community Hall of Fame
kicker: HALL OF FAME

# 页面顶部的一句话介绍（可留空）
tagline: 记录每一位把云社区带到线下、带到身边的人。

# 页面各区块的标题文案
sections:
  roster: 社区名人
  rosterHint: 点击卡片查看完整介绍

# 页脚
footer:
  text: 由社区共同维护 · 内容修改只需编辑 content/ 目录下的 YAML
  links:
    - label: 亚马逊云科技开发者社区
      url: https://dev.amazoncloud.cn/

# ------------------------------------------------------------
#  分享卡片（Open Graph）
# ------------------------------------------------------------
#  链接发到微信 / Slack / Twitter 时显示的标题、描述和配图。
#  改完要重新构建才生效（这些是写进 HTML 的，不是运行时读的）。
# ------------------------------------------------------------
share:
  # 留空则用上面的 title / subtitle
  title: UG 名人榜 · 亚马逊云科技 Community Hall of Fame
  description: 记录每一位把云社区带到线下、带到身边的人 —— UGL、UGA、Community Builder 与志愿者的介绍。

  # 站点上线后的正式地址，用于把下面的图片路径拼成绝对地址。
  # 微信、Twitter 等平台不认相对路径，所以这项必须填对，
  # 否则分享出去只有标题没有图。结尾不要加斜杠。
  #
  # GitHub Pages 的部署 workflow 会用 SITE_URL 覆盖这里，取的是 Pages
  # 报的真实地址；所以这个值只在本地和别的部署方式下生效。
  siteUrl: https://cloudsmithy.github.io/ug-hall-of-fame

  # 分享配图，放在 public/ 下。建议 1200×630（各平台通吃的比例）
  # 这张图由 npm run og 从 scripts/og-cover.svg 生成，改设计就改那个 SVG
  image: /og-cover.jpg
  imageAlt: UG 名人榜 · 亚马逊云科技 Community Hall of Fame
