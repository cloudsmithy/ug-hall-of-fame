# ============================================================
#  站点基本信息
# ============================================================
#  改这里可以调整标题、副标题、地图初始视角和页面文案。
#  改完存盘，开发服务器会自动热更新。
# ============================================================

title: UG 名人榜
subtitle: 亚马逊云科技 User Group · Community Hall of Fame
kicker: HALL OF FAME

# 页面顶部的一句话介绍（可留空）
tagline: 记录每一位把云社区带到线下、带到身边的人。

# 地图初始视角
map:
  center: [30.0, 110.0] # [纬度, 经度]
  zoom: 4
  # 成员分布在多个国家时，自动缩放到框住所有标记
  autoFit: true
  # 自动缩放时的最大层级，避免只有一个城市时贴太近
  autoFitMaxZoom: 6

# 页面各区块的标题文案
sections:
  map: 社区版图
  mapHint: 点击地图标记查看成员，同城成员会自动聚合
  roster: 社区名人
  rosterHint: 点击卡片查看完整介绍

# 页脚
footer:
  text: 由社区共同维护 · 内容修改只需编辑 content/ 目录下的 YAML
  links:
    - label: 亚马逊云科技开发者社区
      url: https://dev.amazoncloud.cn/
